  <path d="M348 46 L355 53 L369 38" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <path d="M60 90 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#c5dcff"/>
  <path d="M320 190 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#c5dcff"/>
