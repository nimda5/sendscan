<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img" aria-hidden="true">
  <ellipse cx="200" cy="290" rx="150" ry="18" fill="#0066ff" opacity="0.08"/>

  <!-- printer -->
  <rect x="70" y="176" width="190" height="92" rx="16" fill="#ffffff" stroke="#0066ff" stroke-width="5"/>
  <rect x="96" y="150" width="138" height="34" rx="8" fill="#c5dcff"/>
  <rect x="110" y="200" width="110" height="52" rx="6" fill="#f2f7ff" stroke="#0066ff" stroke-width="3"/>
  <circle cx="238" cy="196" r="6" fill="#0066ff"/>
  <circle cx="238" cy="214" r="6" fill="#0066ff" opacity="0.4"/>

  <!-- scan beams rising from printer -->
